```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng trong CSS</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        th {
            height: 50px;
            text-align: left;
            background-color: #333;
            color: white;
        }

        td {
            height: 80px;
            vertical-align: middle;
            background-color: #f2f2f2;
            color: #333;
        }

        th, td {
            padding: 15px;
        }
    </style>
</head>
<body>

    <h1>Bảng thông tin học viên</h1>

    <table>
        <tr>
            <th>Họ tên</th>
            <th>Tuổi</th>
            <th>Lớp</th>
        </tr>
        <tr>
            <td>Nguyễn Văn A</td>
            <td>20</td>
            <td>Web</td>
        </tr>
        <tr>
            <td>Trần Thị B</td>
            <td>21</td>
            <td>Web</td>
        </tr>
    </table>

</body>
</html>
